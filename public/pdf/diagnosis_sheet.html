<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IT診断分析表</title>
    <style>    
        html {
            font-family: ipaexm;
            font-size:12px
        }
        .half-border-box {
            margin-top: -127px;
            position: relative;
            width: 100%;
            height: 750px;
            border: 0.5px solid #90EE90;
            border-top: none;
            box-sizing: border-box;
        }

        .half-border-box::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            border-top: 0.5px solid #90EE90;
        }

        table .title_td {
            width: 100px;
            height:5px !important;
            font-size: 12px;
            padding:1;
            /* margin: 0; */
            /* background:linear-gradient(111deg, #87D782 0%, #22BC8E 100%); */
            background-color: #CEF2D3;
            border: 1px solid #90EE90;
            text-align: center;
            /* vertical-align: middle;  */
        }

        table .data_td {
            height: 40px;
            border: 1px solid #90EE90;
            text-align: center;
            /* vertical-align: bottom; */
        }
        
    </style>
</head>
<body>
    <div style="display: flex; align-items: flex-start;">
        <div style="border: 0.5px solid #90EE90; width: 311px;  height: 100px; padding: 20px; border-bottom: none; box-sizing: border-box;">
            <div style="display: flex;">
                <img src="{{logo}}" alt="" style="height: 100px;margin-top: 15px;">
                <div style="">
                <div style="margin-left: 115px;margin-top:20px;font-size: 13px;">株式会社ジエンジサービス</div>
                <div style="margin-left:100px;font-size: 22px;margin-top:15px;">ITスキル診断分析表</div>
                    </div>
            </div>
        </div>
        <div style="margin-left: 370px;">
          <table cellpadding="1" cellspacing="1" style="border:1px solid #90EE90; border-collapse: collapse;">
            <thead style="background:linear-gradient(111deg, #87D782 0%, #22BC8E 100%);">
              <tr>
                <th class="title_td">名　前</th>
                <th class="title_td">生　年　月　日</th>
                <th class="title_td">学　歴</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="data_td">{{name}}</td>
                <td class="data_td">{{birth}}</td>
                <td class="data_td">{{education}}</td>
              </tr>
              <tr>
                <td class="title_td">ITスキル有無</td>
                <td class="title_td">経験分野詳細</td>
                <td class="title_td">申　込　日</td>
              </tr>
              <tr>
                <td class="data_td">{{skill}}</td>
                <td class="data_td">{{class2nd}}</td>
                <td class="data_td">{{apply_date}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="half-border-box"></div>

</body>
</html>
