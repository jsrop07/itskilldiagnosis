<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 診断</title>
</head>
<body>

<form id="pdfForm" method="post" target="iframe1" action="/admin/situation/itdiagnosis">
    <input type="hidden" name="id" id="hiddenId" value="" />
</form>

<iframe name="iframe1" id="iframe1" width="100%" height="1000px"></iframe>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id"); 

    if (id) {
        // hidden input에 id 값 설정
        document.getElementById("hiddenId").value = id;
        document.getElementById("pdfForm").submit();
    }
});
</script>

</body>
</html>
